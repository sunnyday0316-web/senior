<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 환경에서 화면 크기가 자동으로 맞춰지도록 설정하는 필수 태그입니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 두뇌 회전 퀴즈</title>
  <!-- 깔끔한 디자인을 위해 Tailwind CSS라는 디자인 도구를 불러옵니다. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 어르신들이 보기 편하도록 기본 글꼴 크기를 키우고, 라디오 버튼 크기를 확대합니다. */
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background-color: #f3f4f6; }
    input[type="radio"] { width: 24px; height: 24px; accent-color: #2563eb; cursor: pointer; }
    input[type="text"] { font-size: 1.25rem; }
    /* 터치하기 쉽도록 라디오 버튼이 포함된 라벨의 클릭 영역을 넓힙니다. */
    .radio-label { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb; cursor: pointer; }
    .radio-label:active { background: #eff6ff; }
  </style>
</head>
<body class="text-gray-800 antialiased p-4 md:p-8">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-10">
    <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">🧠 오늘의 두뇌 회전 퀴즈</h1>
    
    <!-- 퀴즈 폼 시작 -->
    <form id="quiz-form" class="space-y-10">
      
      <!-- 문제 1: 이름 입력 -->
      <div class="space-y-4">
        <h2 class="text-xl font-semibold bg-blue-50 p-3 rounded-lg"><span class="text-blue-600 mr-2">문제 1.</span>참여자분의 성함을 입력해 주세요.</h2>
        <input type="text" name="userName" placeholder="이름 입력 (예: 홍길동)" required class="w-full mt-4 p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none">
      </div>

      <!-- 문제 2: 그림 단답형 1 -->
      <div class="space-y-4">
        <h2 class="text-xl font-semibold bg-blue-50 p-3 rounded-lg"><span class="text-blue-600 mr-2">문제 2.</span>아래 그림을 보고 어떤 과일인지 이름을 적어주세요.</h2>
        <img src="https://images.unsplash.com/photo-1568702846914-96b305d2aaeb?auto=format&fit=crop&w=400&q=80" alt="빨간색 과일 사진" onerror="this.src='https://placehold.co/400x250/fee2e2/dc2626?text=Apple'" class="w-full max-w-sm mx-auto rounded-xl shadow-md border border-gray-200">
        <input type="text" name="q2" placeholder="정답 입력 (예: 바나나)" required class="w-full mt-4 p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none">
      </div>

      <!-- 문제 3: 그림 단답형 2 -->
      <div class="space-y-4">
        <h2 class="text-xl font-semibold bg-blue-50 p-3 rounded-lg"><span class="text-blue-600 mr-2">문제 3.</span>아래 사진 속 동물은 어떤 종류의 동물일까요? (예: 강아지, 고양이 등)</h2>
        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=400&q=80" alt="동물 사진" onerror="this.src='https://placehold.co/400x250/fef08a/ca8a04?text=Dog'" class="w-full max-w-sm mx-auto rounded-xl shadow-md border border-gray-200">
        <input type="text" name="q3" placeholder="정답 입력" required class="w-full mt-4 p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none">
      </div>

      <!-- 문제 4: 사지선다형 1 -->
      <div class="space-y-4">
        <h2 class="text-xl font-semibold bg-blue-50 p-3 rounded-lg"><span class="text-blue-600 mr-2">문제 4.</span>우리나라(대한민국)의 수도는 어디일까요?</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-lg">
          <label class="radio-label">
            <input type="radio" name="q4" value="부산" required> <span>1. 부산</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="q4" value="서울"> <span>2. 서울</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="q4" value="대전"> <span>3. 대전</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="q4" value="제주"> <span>4. 제주</span>
          </label>
        </div>
      </div>

      <!-- 문제 5: 사지선다형 2 -->
      <div class="space-y-4">
        <h2 class="text-xl font-semibold bg-blue-50 p-3 rounded-lg"><span class="text-blue-600 mr-2">문제 5.</span>1년은 모두 몇 달(월)로 이루어져 있을까요?</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-lg">
          <label class="radio-label">
            <input type="radio" name="q5" value="10달" required> <span>1. 10달</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="q5" value="11달"> <span>2. 11달</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="q5" value="12달"> <span>3. 12달</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="q5" value="24달"> <span>4. 24달</span>
          </label>
        </div>
      </div>

      <!-- 문제 6: 오늘의 기분 (1~10 선택) -->
      <div class="space-y-4">
        <h2 class="text-xl font-semibold bg-blue-50 p-3 rounded-lg"><span class="text-blue-600 mr-2">문제 6.</span>오늘의 기분은 1부터 10까지 중 어느 정도인가요? (10이 가장 좋음)</h2>
        <div class="grid grid-cols-5 md:grid-cols-10 gap-2">
          <label class="flex flex-col items-center justify-center bg-gray-50 border border-gray-300 rounded-lg py-3 cursor-pointer hover:bg-blue-100">
            <input type="radio" name="mood" value="1" required class="mb-2">
            <span class="text-xl font-bold">1</span>
          </label>
          <label class="flex flex-col items-center justify-center bg-gray-50 border border-gray-300 rounded-lg py-3 cursor-pointer hover:bg-blue-100">
            <input type="radio" name="mood" value="2" required class="mb-2">
            <span class="text-xl font-bold">2</span>
          </label>
          <label class="flex flex-col items-center justify-center bg-gray-50 border border-gray-300 rounded-lg py-3 cursor-pointer hover:bg-blue-100">
            <input type="radio" name="mood" value="3" required class="mb-2">
            <span class="text-xl font-bold">3</span>
          </label>
          <label class="flex flex-col items-center justify-center bg-gray-50 border border-gray-300 rounded-lg py-3 cursor-pointer hover:bg-blue-100">
            <input type="radio" name="mood" value="4" required class="mb-2">
            <span class="text-xl font-bold">4</span>
          </label>
          <label class="flex flex-col items-center justify-center bg-gray-50 border border-gray-300 rounded-lg py-3 cursor-pointer hover:bg-blue-100">
            <input type="radio" name="mood" value="5" required class="mb-2">
            <span class="text-xl font-bold">5</span>
          </label>
          <label class="flex flex-col items-center justify-center bg-gray-50 border border-gray-300 rounded-lg py-3 cursor-pointer hover:bg-blue-100">
            <input type="radio" name="mood" value="6" required class="mb-2">
            <span class="text-xl font-bold">6</span>
          </label>
          <label class="flex flex-col items-center justify-center bg-gray-50 border border-gray-300 rounded-lg py-3 cursor-pointer hover:bg-blue-100">
            <input type="radio" name="mood" value="7" required class="mb-2">
            <span class="text-xl font-bold">7</span>
          </label>
          <label class="flex flex-col items-center justify-center bg-gray-50 border border-gray-300 rounded-lg py-3 cursor-pointer hover:bg-blue-100">
            <input type="radio" name="mood" value="8" required class="mb-2">
            <span class="text-xl font-bold">8</span>
          </label>
          <label class="flex flex-col items-center justify-center bg-gray-50 border border-gray-300 rounded-lg py-3 cursor-pointer hover:bg-blue-100">
            <input type="radio" name="mood" value="9" required class="mb-2">
            <span class="text-xl font-bold">9</span>
          </label>
          <label class="flex flex-col items-center justify-center bg-gray-50 border border-gray-300 rounded-lg py-3 cursor-pointer hover:bg-blue-100">
            <input type="radio" name="mood" value="10" required class="mb-2">
            <span class="text-xl font-bold">10</span>
          </label>
        </div>
      </div>

      <!-- 제출 버튼 -->
      <div class="pt-6">
        <button type="submit" id="submit-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-5 px-6 rounded-xl text-2xl transition duration-200 shadow-md">
          정답 제출하기
        </button>
      </div>
      
    </form>

    <!-- 제출 완료 후 보여줄 메시지 창 (초기에는 숨겨져 있습니다) -->
    <div id="success-message" class="hidden text-center py-10">
      <div class="text-5xl mb-4">🎉</div>
      <h2 class="text-3xl font-bold text-green-600 mb-2">제출이 완료되었습니다!</h2>
      <p class="text-xl text-gray-600">오늘도 퀴즈 푸시느라 고생 많으셨습니다.</p>
      <button onclick="location.reload()" class="mt-8 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg text-lg">
        처음으로 돌아가기
      </button>
    </div>
  </div>

  <script>
    // =========================================================================
    // ★ [매우 중요] 아래 'URL_입력_칸' 부분에 구글 앱스 스크립트 배포 주소를 넣으세요.
    // 예시: const scriptURL = 'https://script.google.com/macros/s/ABCDEFG/exec';
    // =========================================================================
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxFwYZqi3PiIvVeAW3Lt5nPqGMyp1HH8Chu3uJu9AvuwccgjNFyfSpBbc4s99lVEkY/exec';
    
    // HTML 화면의 폼(form) 요소를 가져옵니다.
    const form = document.forms['quiz-form'];
    const submitButton = document.getElementById('submit-button');
    const successMessage = document.getElementById('success-message');

    // 사용자가 '제출하기' 버튼을 눌렀을 때 실행되는 함수입니다.
    form.addEventListener('submit', e => {
      // 페이지가 새로고침되는 기본 성질을 막아줍니다.
      e.preventDefault();
      
      // 주소가 입력되지 않았을 경우 안내 메시지를 띄웁니다.
      if(scriptURL === 'URL_입력_칸') {
        const warning = document.createElement('div');
        warning.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-xl text-xl shadow-lg font-bold z-50';
        warning.innerText = '구글 시트 연동 URL이 입력되지 않았습니다.';
        document.body.appendChild(warning);
        setTimeout(() => warning.remove(), 4000);
        return;
      }

      // 제출 중일 때 버튼 모양을 바꿉니다. (중복 제출 방지)
      submitButton.disabled = true;
      submitButton.innerHTML = '저장 중입니다... 잠시만 기다려주세요 ⏳';
      submitButton.classList.replace('bg-blue-600', 'bg-gray-400');

      // fetch 기능: 구글 앱스 스크립트로 데이터를 몰래(백그라운드에서) 보냅니다.
      // CORS(보안 정책) 에러로 인한 'Failed to fetch' 문제를 해결하기 위해 mode: 'no-cors'를 추가합니다.
      fetch(scriptURL, { method: 'POST', body: new FormData(form), mode: 'no-cors'})
        .then(response => {
          // 성공적으로 전송되면 기존 퀴즈 화면을 숨기고 완료 메시지를 보여줍니다.
          form.classList.add('hidden');
          successMessage.classList.remove('hidden');
        })
        .catch(error => {
          // 오류가 났을 경우 (이 부분은 할루시네이션 지침에 따라 추측성 원인 대신 사실만 알립니다.)
          console.error('Error!', error.message);
          submitButton.disabled = false;
          submitButton.innerHTML = '전송 실패. 다시 시도하기';
          submitButton.classList.replace('bg-gray-400', 'bg-red-500');
        });
    });
  </script>
</body>
</html>
